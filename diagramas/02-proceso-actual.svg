<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1010" role="img" aria-labelledby="title desc">
  <title id="title">Proceso actual AS-IS para comunicar calificaciones</title>
  <desc id="desc">Diagrama BPMN legible con tres pools: Escuela, Estudiante y Encargado legal. Distingue actividades confirmadas y pasos por validar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="messageArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <style><![CDATA[
      .page { fill:#ffffff; }
      .title { font:700 28px 'Segoe UI',Arial,sans-serif; fill:#102a43; }
      .subtitle { font:15px 'Segoe UI',Arial,sans-serif; fill:#486581; }
      .pool { fill:#f8fafc; stroke:#334155; stroke-width:2; }
      .lane { fill:none; stroke:#94a3b8; stroke-width:1.3; }
      .poolLabel { font:700 16px 'Segoe UI',Arial,sans-serif; fill:#102a43; text-anchor:middle; }
      .laneLabel { font:600 14px 'Segoe UI',Arial,sans-serif; fill:#334155; text-anchor:middle; }
      .task { fill:#eef6ff; stroke:#275d85; stroke-width:2; rx:10; }
      .taskPV { fill:#fff7e6; stroke:#c47a00; stroke-width:2; stroke-dasharray:7 5; rx:10; }
      .event { fill:#fff; stroke:#275d85; stroke-width:2.5; }
      .end { fill:#fff; stroke:#275d85; stroke-width:4; }
      .eventPV { fill:#fff7e6; stroke:#c47a00; stroke-width:2.5; stroke-dasharray:5 4; }
      .gateway { fill:#fff; stroke:#275d85; stroke-width:2; }
      .gatewayPV { fill:#fff7e6; stroke:#c47a00; stroke-width:2; stroke-dasharray:5 4; }
      .seq { fill:none; stroke:#334155; stroke-width:2; marker-end:url(#arrow); }
      .msg { fill:none; stroke:#475569; stroke-width:2; stroke-dasharray:8 6; marker-end:url(#messageArrow); }
      .assoc { fill:none; stroke:#c47a00; stroke-width:1.7; stroke-dasharray:3 4; }
      .label { font:13px 'Segoe UI',Arial,sans-serif; fill:#102a43; text-anchor:middle; }
      .small { font:12px 'Segoe UI',Arial,sans-serif; fill:#334155; }
      .tiny { font:11px 'Segoe UI',Arial,sans-serif; fill:#475569; }
      .edgeLabel { font:12px 'Segoe UI',Arial,sans-serif; fill:#334155; paint-order:stroke; stroke:#fff; stroke-width:4; stroke-linejoin:round; }
      .note { fill:#fffaf0; stroke:#c47a00; stroke-width:1.5; }
      .noteText { font:12px 'Segoe UI',Arial,sans-serif; fill:#7c4a00; }
      .legendBox { fill:#fff; stroke:#cbd5e1; stroke-width:1; rx:8; }
    ]]></style>
  </defs>

  <rect class="page" width="1800" height="1010"/>
  <text class="title" x="40" y="38">Proceso actual AS-IS — comunicación de calificaciones mediante hoja física</text>
  <text class="subtitle" x="40" y="64">PC1 · Centro Educativo María Montessori · El Portal Académico no aparece en este proceso actual</text>

  <g transform="translate(1110,18)">
    <rect class="legendBox" x="0" y="0" width="650" height="62"/>
    <rect class="task" x="14" y="13" width="52" height="28"/>
    <text class="small" x="76" y="32">evidencia confirmada</text>
    <rect class="taskPV" x="220" y="13" width="52" height="28"/>
    <text class="small" x="282" y="32">[PV] por validar</text>
    <path class="seq" d="M400,27 H455"/>
    <text class="small" x="465" y="32">secuencia interna</text>
    <path class="msg" d="M568,27 H620"/>
  </g>

  <!-- Pool Escuela -->
  <rect class="pool" x="40" y="100" width="1720" height="300"/>
  <rect class="lane" x="78" y="100" width="1682" height="190"/>
  <rect class="lane" x="78" y="290" width="1682" height="110"/>
  <text class="poolLabel" transform="translate(63 250) rotate(-90)">ESCUELA</text>
  <text class="laneLabel" transform="translate(96 195) rotate(-90)">DOCENTE</text>
  <text class="laneLabel" transform="translate(96 345) rotate(-90)">DIRECCIÓN</text>

  <!-- Escuela: camino de hoja -->
  <circle class="event" cx="135" cy="165" r="18"/>
  <text class="tiny" x="108" y="200">Hay calificación</text>
  <rect class="task" x="185" y="132" width="180" height="66"/>
  <text class="label" x="275" y="158"><tspan x="275">AC-01 Preparar hoja</tspan><tspan x="275" dy="17">física de calificaciones</tspan></text>
  <rect class="task" x="420" y="132" width="180" height="66"/>
  <text class="label" x="510" y="158"><tspan x="510">AC-02 Entregar hoja</tspan><tspan x="510" dy="17">al estudiante</tspan></text>
  <circle class="end" cx="655" cy="165" r="18"/>
  <text class="tiny" x="608" y="201">Bajo custodia</text>
  <path class="seq" d="M153,165 H185"/>
  <path class="seq" d="M365,165 H420"/>
  <path class="seq" d="M600,165 H637"/>

  <!-- Escuela: atención por validar -->
  <circle class="eventPV" cx="805" cy="225" r="18"/>
  <path d="M793,219 l12,8 12,-8" fill="none" stroke="#c47a00" stroke-width="1.5"/>
  <text class="tiny" x="760" y="260">Consulta/queja [PV]</text>
  <rect class="taskPV" x="855" y="192" width="185" height="66"/>
  <text class="label" x="947" y="218"><tspan x="947">AC-06 Atender por</tspan><tspan x="947" dy="17">canal actual [PV]</tspan></text>
  <polygon class="gatewayPV" points="1090,200 1115,225 1090,250 1065,225"/>
  <text class="tiny" x="1050" y="273">¿Escala? [PV]</text>
  <rect class="taskPV" x="1210" y="192" width="180" height="66"/>
  <text class="label" x="1300" y="218"><tspan x="1300">AC-07 Comunicar</tspan><tspan x="1300" dy="17">respuesta [PV]</tspan></text>
  <circle class="end" cx="1450" cy="225" r="18"/>
  <path class="seq" d="M823,225 H855"/>
  <path class="seq" d="M1040,225 H1065"/>
  <path class="seq" d="M1115,225 H1210"/>
  <text class="edgeLabel" x="1155" y="215">No [PV]</text>
  <path class="seq" d="M1090,250 V335 H1160"/>
  <text class="edgeLabel" x="1100" y="300">Sí [PV]</text>
  <rect class="taskPV" x="1160" y="305" width="210" height="66"/>
  <text class="label" x="1265" y="330"><tspan x="1265">AC-08 Intervenir en</tspan><tspan x="1265" dy="17">el caso [PV]</tspan></text>
  <path class="seq" d="M1370,338 H1410 V258 H1390"/>
  <path class="seq" d="M1390,225 H1432"/>
  <path class="assoc" d="M947,258 V315 H820"/>
  <path class="note" d="M520,305 h300 v60 h-290 l-10,10 z"/>
  <text class="noteText" x="535" y="327"><tspan x="535">PV-04/PV-05: validar canal, pasos, responsables,</tspan><tspan x="535" dy="17">plazos y escalamiento. No se presume mediación formal.</tspan></text>

  <!-- Pool Estudiante -->
  <rect class="pool" x="40" y="440" width="1720" height="190"/>
  <text class="poolLabel" transform="translate(63 535) rotate(-90)">ESTUDIANTE</text>
  <circle class="event" cx="135" cy="525" r="18"/>
  <path d="M123,519 l12,8 12,-8" fill="none" stroke="#275d85" stroke-width="1.5"/>
  <text class="tiny" x="98" y="559">Recibe hoja</text>
  <rect class="task" x="195" y="492" width="190" height="66"/>
  <text class="label" x="290" y="518"><tspan x="290">AC-03 Transportar hoja</tspan><tspan x="290" dy="17">hacia el hogar</tspan></text>
  <polygon class="gateway" points="445,500 470,525 445,550 420,525"/>
  <text class="tiny" x="398" y="574">¿Entrega a tiempo?</text>
  <rect class="task" x="540" y="462" width="205" height="62"/>
  <text class="label" x="642" y="487"><tspan x="642">AC-04 Entregar hoja</tspan><tspan x="642" dy="17">al encargado</tspan></text>
  <rect class="task" x="540" y="548" width="225" height="62"/>
  <text class="label" x="652" y="573"><tspan x="652">AC-05 Retrasar, ocultar</tspan><tspan x="652" dy="17">o no entregar</tspan></text>
  <circle class="end" cx="820" cy="493" r="18"/>
  <circle class="end" cx="820" cy="579" r="18"/>
  <text class="tiny" x="848" y="584">No recibido por este canal</text>
  <path class="seq" d="M153,525 H195"/>
  <path class="seq" d="M385,525 H420"/>
  <path class="seq" d="M445,500 V493 H540"/>
  <text class="edgeLabel" x="493" y="483">Sí</text>
  <path class="seq" d="M445,550 V579 H540"/>
  <text class="edgeLabel" x="493" y="569">No</text>
  <path class="seq" d="M745,493 H802"/>
  <path class="seq" d="M765,579 H802"/>
  <path class="assoc" d="M765,600 H990"/>
  <path class="note" d="M990,550 h330 v58 h-320 l-10,10 z"/>
  <text class="noteText" x="1005" y="572"><tspan x="1005">E-03 confirma que ocurre; PV-02 debe cuantificar</tspan><tspan x="1005" dy="17">frecuencia, plazo esperado y volumen.</tspan></text>

  <!-- Pool Encargado -->
  <rect class="pool" x="40" y="670" width="1720" height="250"/>
  <text class="poolLabel" transform="translate(63 795) rotate(-90)">ENCARGADO LEGAL</text>
  <circle class="event" cx="135" cy="775" r="18"/>
  <text class="tiny" x="92" y="810">Espera información</text>
  <rect class="task" x="190" y="742" width="200" height="66"/>
  <text class="label" x="290" y="767"><tspan x="290">AC-09 Esperar/recibir</tspan><tspan x="290" dy="17">la hoja del estudiante</tspan></text>
  <polygon class="gateway" points="450,750 475,775 450,800 425,775"/>
  <text class="tiny" x="414" y="826">¿Recibe?</text>
  <rect class="task" x="535" y="700" width="180" height="62"/>
  <text class="label" x="625" y="727"><tspan x="625">AC-10 Revisar</tspan><tspan x="625" dy="17">calificaciones</tspan></text>
  <polygon class="gatewayPV" points="775,706 800,731 775,756 750,731"/>
  <text class="tiny" x="730" y="780">¿Aclaración? [PV]</text>
  <rect class="taskPV" x="860" y="699" width="190" height="64"/>
  <text class="label" x="955" y="725"><tspan x="955">AC-12 Solicitar</tspan><tspan x="955" dy="17">aclaración [PV]</tspan></text>
  <circle class="end" cx="955" cy="806" r="18"/>
  <text class="tiny" x="910" y="837">Sin aclaración</text>
  <rect class="task" x="535" y="830" width="220" height="64"/>
  <text class="label" x="645" y="856"><tspan x="645">AC-11 Contactar escuela</tspan><tspan x="645" dy="17">o presentar queja</tspan></text>
  <circle class="eventPV" cx="1215" cy="800" r="18"/>
  <path d="M1203,794 l12,8 12,-8" fill="none" stroke="#c47a00" stroke-width="1.5"/>
  <text class="tiny" x="1162" y="835">AC-13 Respuesta [PV]</text>
  <circle class="end" cx="1395" cy="800" r="18"/>
  <path class="seq" d="M153,775 H190"/>
  <path class="seq" d="M390,775 H425"/>
  <path class="seq" d="M450,750 V731 H535"/>
  <text class="edgeLabel" x="495" y="721">Sí</text>
  <path class="seq" d="M450,800 V862 H535"/>
  <text class="edgeLabel" x="472" y="842">No / tarde</text>
  <path class="seq" d="M715,731 H750"/>
  <path class="seq" d="M800,731 H860"/>
  <text class="edgeLabel" x="825" y="720">Sí [PV]</text>
  <path class="seq" d="M775,756 V806 H937"/>
  <text class="edgeLabel" x="815" y="796">No</text>
  <path class="seq" d="M1050,731 H1120 V800 H1197"/>
  <path class="seq" d="M755,862 H1120 V800 H1197"/>
  <path class="seq" d="M1233,800 H1377"/>

  <!-- Message flows between pools only -->
  <path class="msg" d="M510,198 V420 H135 V507"/>
  <text class="edgeLabel" x="268" y="412">MF-01 hoja física</text>
  <path class="msg" d="M642,524 V650 H290 V742"/>
  <text class="edgeLabel" x="420" y="642">MF-02 hoja entregada</text>
  <path class="msg" d="M645,830 V650 H805 V243"/>
  <text class="edgeLabel" x="660" y="659">MF-03 queja / solicitud [canal PV]</text>
  <path class="msg" d="M1300,258 V650 H1215 V782"/>
  <text class="edgeLabel" x="1235" y="642">MF-04 respuesta [PV]</text>

  <rect class="legendBox" x="40" y="944" width="1720" height="45"/>
  <text class="small" x="60" y="972"><tspan font-weight="700">Límite:</tspan> el diagrama termina en la comunicación actual. Perfiles, avisos automáticos, mensajería, discrepancias digitales, reportes, configuración y auditoría pertenecen al TO-BE.</text>
</svg>
