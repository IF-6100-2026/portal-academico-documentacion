<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Portal Académico — diagrama de once casos de uso propuestos</title>
  <desc id="desc">Diagrama de casos de uso con Encargado legal, Docente, Administrador institucional, Dirección o mediador, servicio de notificaciones, Estudiante indirecto y Auditor institucional.</desc>
  <defs>
    <style><![CDATA[
      .page{fill:#fff}.title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#102a43}.subtitle{font:15px 'Segoe UI',Arial,sans-serif;fill:#486581}
      .boundary{fill:#f8fbff;stroke:#275d85;stroke-width:2.4}.boundaryTitle{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#17324d}
      .uc{fill:#fff;stroke:#275d85;stroke-width:2}.support{fill:#f7f2ff;stroke:#7056a3;stroke-width:2}
      .ucText{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#17324d;text-anchor:middle}.actorLine{fill:none;stroke:#263746;stroke-width:2.6;stroke-linecap:round}
      .actorText{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#263746;text-anchor:middle}.assoc{fill:none;stroke:#64748b;stroke-width:1.7;opacity:.72}
      .indirect{fill:none;stroke:#c47a00;stroke-width:2;stroke-dasharray:7 5}.note{fill:#fffaf0;stroke:#c47a00;stroke-width:1.5}
      .noteText{font:12px 'Segoe UI',Arial,sans-serif;fill:#7c4a00}.legend{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .small{font:12px 'Segoe UI',Arial,sans-serif;fill:#334155}.groupLabel{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#7056a3}
    ]]></style>
    <g id="actorShape">
      <circle class="actorLine" cx="0" cy="-25" r="14"/>
      <path class="actorLine" d="M0,-11 V35 M-27,7 H27 M0,35 L-24,70 M0,35 L24,70"/>
    </g>
  </defs>

  <rect class="page" width="1800" height="1120"/>
  <text class="title" x="40" y="40">Portal Académico — casos de uso propuestos</text>
  <text class="subtitle" x="40" y="67">TO-BE conceptual · 11 objetivos de actor · Todos sujetos a validación con la organización</text>

  <rect class="boundary" x="300" y="100" width="1200" height="875" rx="10"/>
  <text class="boundaryTitle" x="325" y="130">Frontera del Portal Académico</text>

  <!-- Associations are drawn behind use cases -->
  <!-- Encargado legal -->
  <path class="assoc" d="M175,235 L385,200"/>
  <path class="assoc" d="M175,260 L385,540"/>
  <path class="assoc" d="M175,260 L765,540"/>
  <path class="assoc" d="M175,260 L1145,540"/>
  <!-- Docente -->
  <path class="assoc" d="M175,500 L385,360"/>
  <path class="assoc" d="M175,500 L765,360"/>
  <path class="assoc" d="M175,500 L385,540"/>
  <path class="assoc" d="M175,500 L765,540"/>
  <path class="assoc" d="M175,500 L1145,540"/>
  <path class="assoc" d="M175,500 L1145,360"/>
  <!-- Estudiante indirecto -->
  <path class="indirect" d="M175,795 L385,390"/>
  <path class="indirect" d="M175,795 L765,390"/>
  <!-- Administrador -->
  <path class="assoc" d="M1625,195 L1035,200"/>
  <path class="assoc" d="M1625,195 L1425,200"/>
  <!-- Dirección -->
  <path class="assoc" d="M1625,440 L655,540"/>
  <path class="assoc" d="M1625,440 L1425,540"/>
  <path class="assoc" d="M1625,440 L795,720"/>
  <path class="assoc" d="M1625,440 L1425,200"/>
  <path class="assoc" d="M1625,440 L1270,720"/>
  <!-- Servicio y auditor -->
  <path class="assoc" d="M1625,690 L655,540"/>
  <path class="assoc" d="M1625,900 L1270,720"/>

  <!-- Use cases row 1 -->
  <ellipse class="uc" cx="520" cy="200" rx="145" ry="52"/>
  <text class="ucText" x="520" y="190"><tspan x="520">UC-01</tspan><tspan x="520" dy="18">Consultar progreso académico</tspan></text>
  <ellipse class="uc" cx="900" cy="200" rx="145" ry="52"/>
  <text class="ucText" x="900" y="190"><tspan x="900">UC-02</tspan><tspan x="900" dy="18">Vincular encargado</tspan><tspan x="900" dy="17">con estudiante</tspan></text>
  <ellipse class="support" cx="1280" cy="200" rx="155" ry="56"/>
  <text class="ucText" x="1280" y="190"><tspan x="1280">UC-10</tspan><tspan x="1280" dy="18">Administrar configuración</tspan><tspan x="1280" dy="17">y accesos</tspan></text>

  <!-- Use cases row 2 -->
  <ellipse class="uc" cx="520" cy="360" rx="145" ry="52"/>
  <text class="ucText" x="520" y="350"><tspan x="520">UC-03</tspan><tspan x="520" dy="18">Publicar evaluación asignada</tspan></text>
  <ellipse class="uc" cx="900" cy="360" rx="145" ry="52"/>
  <text class="ucText" x="900" y="350"><tspan x="900">UC-04</tspan><tspan x="900" dy="18">Publicar resultado</tspan><tspan x="900" dy="17">de evaluación</tspan></text>
  <ellipse class="uc" cx="1280" cy="360" rx="145" ry="52"/>
  <text class="ucText" x="1280" y="350"><tspan x="1280">UC-09</tspan><tspan x="1280" dy="18">Corregir publicación</tspan><tspan x="1280" dy="17">académica</tspan></text>

  <!-- Use cases row 3 -->
  <ellipse class="uc" cx="520" cy="540" rx="145" ry="52"/>
  <text class="ucText" x="520" y="530"><tspan x="520">UC-05</tspan><tspan x="520" dy="18">Gestionar avisos</tspan><tspan x="520" dy="17">no consultados</tspan></text>
  <ellipse class="uc" cx="900" cy="540" rx="145" ry="52"/>
  <text class="ucText" x="900" y="530"><tspan x="900">UC-06</tspan><tspan x="900" dy="18">Comunicarse sobre el</tspan><tspan x="900" dy="17">seguimiento académico</tspan></text>
  <ellipse class="uc" cx="1280" cy="540" rx="145" ry="52"/>
  <text class="ucText" x="1280" y="530"><tspan x="1280">UC-07</tspan><tspan x="1280" dy="18">Gestionar discrepancia</tspan><tspan x="1280" dy="17">académica</tspan></text>

  <!-- Use cases row 4 -->
  <ellipse class="uc" cx="650" cy="720" rx="155" ry="54"/>
  <text class="ucText" x="650" y="710"><tspan x="650">UC-08</tspan><tspan x="650" dy="18">Consultar reportes</tspan><tspan x="650" dy="17">institucionales</tspan></text>
  <ellipse class="support" cx="1120" cy="720" rx="160" ry="56"/>
  <text class="ucText" x="1120" y="710"><tspan x="1120">UC-11</tspan><tspan x="1120" dy="18">Consultar bitácora</tspan><tspan x="1120" dy="17">de auditoría</tspan></text>
  <text class="groupLabel" x="1120" y="790" text-anchor="middle">Capacidad de soporte y control</text>

  <!-- Note about notifications -->
  <path class="note" d="M470,835 h850 v74 H480 l-10,10 z"/>
  <text class="noteText" x="495" y="858"><tspan x="495">Relación funcional: UC-03, UC-04 y UC-09 generan avisos académicos; UC-05 trata los avisos que continúan sin consulta.</tspan><tspan x="495" dy="19">No se modela como «include» porque gestionar avisos pendientes ocurre después y solo cuando se cumplen sus condiciones.</tspan></text>

  <!-- Actors -->
  <use href="#actorShape" transform="translate(145 210)"/>
  <text class="actorText" x="145" y="305">Encargado legal</text>

  <use href="#actorShape" transform="translate(145 475)"/>
  <text class="actorText" x="145" y="570">Docente</text>

  <use href="#actorShape" transform="translate(145 755)"/>
  <text class="actorText" x="145" y="850"><tspan x="145">Estudiante</tspan><tspan x="145" dy="17">(indirecto)</tspan></text>

  <use href="#actorShape" transform="translate(1655 165)"/>
  <text class="actorText" x="1655" y="260"><tspan x="1655">Administrador</tspan><tspan x="1655" dy="17">institucional</tspan></text>

  <use href="#actorShape" transform="translate(1655 410)"/>
  <text class="actorText" x="1655" y="505"><tspan x="1655">Dirección /</tspan><tspan x="1655" dy="17">mediador</tspan></text>

  <use href="#actorShape" transform="translate(1655 660)"/>
  <text class="actorText" x="1655" y="755"><tspan x="1655">Tiempo / servicio</tspan><tspan x="1655" dy="17">de notificaciones</tspan></text>

  <use href="#actorShape" transform="translate(1655 870)"/>
  <text class="actorText" x="1655" y="965"><tspan x="1655">Auditor institucional</tspan><tspan x="1655" dy="17">autorizado</tspan></text>

  <!-- Legend -->
  <rect class="legend" x="40" y="1015" width="1720" height="75" rx="8"/>
  <line class="assoc" x1="65" y1="1042" x2="125" y2="1042"/>
  <text class="small" x="140" y="1047">interacción directa del actor</text>
  <line class="indirect" x1="360" y1="1042" x2="420" y2="1042"/>
  <text class="small" x="435" y="1047">referencia indirecta al estudiante; no implica cuenta de usuario</text>
  <ellipse class="support" cx="940" cy="1042" rx="35" ry="17"/>
  <text class="small" x="990" y="1047">caso de soporte administrativo/auditoría</text>
  <text class="small" x="65" y="1073"><tspan font-weight="700">Alcance:</tspan> propuesta para educación primaria; no generaliza a colegios. Actores, permisos, plazos y canales requieren validación institucional.</text>
</svg>

