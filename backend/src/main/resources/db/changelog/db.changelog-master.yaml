databaseChangeLog:
  - changeSet:
      id: 001-baseline
      author: equipo-montessori
      changes:
        - createTable:
            tableName: schema_baseline
            remarks: Registro inicial de migración del Portal Académico.
            columns:
              - column:
                  name: id
                  type: integer
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-academic-core
      author: equipo-montessori
      comment: Esquema del núcleo de consulta académica y vinculación; incluye datos ficticios de demostración.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE portal_user (
                username VARCHAR(80) PRIMARY KEY,
                display_name VARCHAR(160) NOT NULL,
                role_name VARCHAR(30) NOT NULL,
                active BOOLEAN NOT NULL DEFAULT TRUE
              );
              CREATE TABLE student (
                id UUID PRIMARY KEY,
                full_name VARCHAR(160) NOT NULL,
                grade_level VARCHAR(30) NOT NULL,
                group_name VARCHAR(30) NOT NULL,
                teacher_name VARCHAR(160) NOT NULL,
                active BOOLEAN NOT NULL DEFAULT TRUE
              );
              CREATE TABLE guardian_student_link (
                id UUID PRIMARY KEY,
                guardian_username VARCHAR(80) NOT NULL REFERENCES portal_user(username),
                student_id UUID NOT NULL REFERENCES student(id),
                relationship_type VARCHAR(80) NOT NULL,
                evidence_reference VARCHAR(300) NOT NULL,
                status VARCHAR(20) NOT NULL CHECK (status IN ('ACTIVE', 'SUSPENDED', 'ENDED', 'PENDING')),
                created_by VARCHAR(80) NOT NULL REFERENCES portal_user(username),
                created_at TIMESTAMPTZ NOT NULL,
                changed_by VARCHAR(80) REFERENCES portal_user(username),
                changed_at TIMESTAMPTZ,
                change_reason VARCHAR(500)
              );
              CREATE UNIQUE INDEX uq_guardian_student_active
                ON guardian_student_link(guardian_username, student_id) WHERE status = 'ACTIVE';
              CREATE TABLE guardian_link_history (
                id UUID PRIMARY KEY,
                link_id UUID NOT NULL REFERENCES guardian_student_link(id),
                previous_status VARCHAR(20),
                new_status VARCHAR(20) NOT NULL,
                reason VARCHAR(500) NOT NULL,
                actor_username VARCHAR(80) NOT NULL REFERENCES portal_user(username),
                occurred_at TIMESTAMPTZ NOT NULL
              );
              CREATE TABLE assessment (
                id UUID PRIMARY KEY,
                student_id UUID NOT NULL REFERENCES student(id),
                subject VARCHAR(100) NOT NULL,
                title VARCHAR(180) NOT NULL,
                period VARCHAR(40) NOT NULL,
                assigned_date DATE NOT NULL,
                instructions TEXT NOT NULL,
                published BOOLEAN NOT NULL DEFAULT FALSE
              );
              CREATE INDEX ix_assessment_student_period ON assessment(student_id, period, published);
              CREATE TABLE grade_record (
                id UUID PRIMARY KEY,
                assessment_id UUID NOT NULL UNIQUE REFERENCES assessment(id),
                numeric_value NUMERIC(6, 2) NOT NULL,
                observation TEXT NOT NULL,
                published_date DATE NOT NULL
              );
              CREATE TABLE consultation_log (
                id UUID PRIMARY KEY,
                guardian_username VARCHAR(80) NOT NULL,
                student_id UUID,
                period VARCHAR(40) NOT NULL,
                outcome VARCHAR(30) NOT NULL,
                consulted_at TIMESTAMPTZ NOT NULL
              );
              CREATE INDEX ix_consultation_guardian_time ON consultation_log(guardian_username, consulted_at);
              CREATE TABLE security_access_log (
                id UUID PRIMARY KEY,
                username VARCHAR(80) NOT NULL,
                requested_path VARCHAR(500) NOT NULL,
                occurred_at TIMESTAMPTZ NOT NULL
              );
              INSERT INTO portal_user (username, display_name, role_name) VALUES
                ('encargada.demo', 'Laura Vargas (demostración)', 'GUARDIAN'),
                ('sin-vinculos.demo', 'Persona encargada sin vínculos (demostración)', 'GUARDIAN'),
                ('direccion.demo', 'Dirección (demostración)', 'DIRECTOR'),
                ('docente.demo', 'Docente (demostración)', 'TEACHER');
              INSERT INTO student (id, full_name, grade_level, group_name, teacher_name, active) VALUES
                ('11111111-1111-4111-8111-111111111111', 'Sofía Vargas Mora (dato ficticio)', 'Cuarto', '4-A', 'María Solano (dato ficticio)', TRUE),
                ('22222222-2222-4222-8222-222222222222', 'Mateo Rojas Vega (dato ficticio)', 'Quinto', '5-A', 'Carlos Jiménez (dato ficticio)', TRUE),
                ('33333333-3333-4333-8333-333333333333', 'Estudiante inactivo (dato ficticio)', 'Tercero', '3-A', 'Docente de prueba', FALSE);
              INSERT INTO guardian_student_link
                (id, guardian_username, student_id, relationship_type, evidence_reference, status, created_by, created_at)
              VALUES
                ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', 'encargada.demo', '11111111-1111-4111-8111-111111111111', 'Persona encargada autorizada', 'RESPALDO-DEMO-001 (dato ficticio)', 'ACTIVE', 'direccion.demo', '2026-11-01T09:00:00Z');
              INSERT INTO guardian_link_history (id, link_id, previous_status, new_status, reason, actor_username, occurred_at)
              VALUES ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', NULL, 'ACTIVE', 'Alta de vínculo de demostración; respaldo ficticio.', 'direccion.demo', '2026-11-01T09:00:00Z');
              INSERT INTO assessment (id, student_id, subject, title, period, assigned_date, instructions, published) VALUES
                ('44444444-4444-4444-8444-444444444444', '11111111-1111-4111-8111-111111111111', 'Matemática', 'Práctica de multiplicación (demo)', '2026-II', '2026-11-05', 'Resolver los ejercicios 1 al 8 del cuaderno.', TRUE),
