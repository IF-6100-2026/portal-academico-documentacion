  - changeSet:
      id: 003-pc3-core-completion
      author: equipo-montessori
      comment: Publicaciones recientes, historial de calificaciones y vínculo demo para cubrir CU-01 y CU-02.
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE assessment ADD COLUMN published_at TIMESTAMPTZ;
              UPDATE assessment
                SET published_at = (assigned_date::timestamp AT TIME ZONE 'America/Costa_Rica')
                WHERE published = TRUE;
              CREATE TABLE grade_revision (
                id UUID PRIMARY KEY,
                assessment_id UUID NOT NULL REFERENCES assessment(id),
                numeric_value NUMERIC(6, 2) NOT NULL,
                observation TEXT NOT NULL,
                published_date DATE NOT NULL,
                reason VARCHAR(500) NOT NULL,
                corrected_by VARCHAR(80) NOT NULL REFERENCES portal_user(username),
                corrected_at TIMESTAMPTZ NOT NULL
              );
              CREATE INDEX ix_grade_revision_assessment_time
                ON grade_revision(assessment_id, corrected_at DESC);
              CREATE UNIQUE INDEX uq_guardian_student_pending
                ON guardian_student_link(guardian_username, student_id) WHERE status = 'PENDING';
