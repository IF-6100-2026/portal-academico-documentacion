                 'docente.demo', '2026-11-15T17:00:00Z');
              INSERT INTO student (id, full_name, grade_level, group_name, teacher_name, active)
              VALUES ('44444444-4444-4aaa-8aaa-444444444444',
                'Lucía Soto Campos (dato ficticio)', 'Sexto', '6-A',
                'Docente de demostración', TRUE);
              INSERT INTO guardian_student_link
                (id, guardian_username, student_id, relationship_type, evidence_reference,
                 status, created_by, created_at)
              VALUES ('cccccccc-cccc-4ccc-8ccc-cccccccccccc', 'encargada.demo',
                '44444444-4444-4aaa-8aaa-444444444444', 'Persona encargada autorizada',
                'RESPALDO-DEMO-004 (dato ficticio)', 'ACTIVE', 'direccion.demo',
                '2026-10-15T09:00:00Z');
              INSERT INTO guardian_link_history
                (id, link_id, previous_status, new_status, reason, actor_username, occurred_at)
              VALUES ('dddddddd-dddd-4ddd-8ddd-dddddddddddd',
                'cccccccc-cccc-4ccc-8ccc-cccccccccccc', NULL, 'ACTIVE',
                'Alta de vínculo de demostración; respaldo ficticio.',
                'direccion.demo', '2026-10-15T09:00:00Z');
              INSERT INTO guardian_student_link
                (id, guardian_username, student_id, relationship_type, evidence_reference,
                 status, created_by, created_at, changed_by, changed_at, change_reason)
              VALUES ('abababab-abab-4bab-8bab-abababababab', 'encargada.demo',
                '22222222-2222-4222-8222-222222222222', 'Persona encargada autorizada',
                'EXPEDIENTE-DEMO-PENDIENTE (dato ficticio)', 'PENDING', 'direccion.demo',
                '2026-11-02T09:00:00Z', 'direccion.demo', '2026-11-02T09:00:00Z',
