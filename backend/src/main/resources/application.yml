server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: portal-academico-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:portal_academico}}
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:portal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  demo-users:
    guardian:
      password: ${DEMO_GUARDIAN_PASSWORD:demo-familiar-2026}
    empty-guardian:
      password: ${DEMO_EMPTY_GUARDIAN_PASSWORD:demo-sin-vinculos-2026}
    director:
      password: ${DEMO_DIRECTOR_PASSWORD:demo-direccion-2026}
    teacher:
      password: ${DEMO_TEACHER_PASSWORD:demo-docente-2026}
