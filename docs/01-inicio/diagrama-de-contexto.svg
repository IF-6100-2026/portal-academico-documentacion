<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">C4 nivel 1: contexto del Portal Académico</title>
  <desc id="description">Diagrama C4 de nivel 1: caja negra del Portal Académico y sus relaciones con cuatro entidades externas.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#59796b"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#203d36}.title{font-size:26px;font-weight:700}.actor{font-size:19px;font-weight:700}.small{font-size:13px;fill:#53685f}.flow{font-size:13px}.id{font-size:12px;font-weight:700;fill:#b96e45}.portal{font-size:23px;font-weight:700;fill:#fff}.subtitle{font-size:14px;fill:#dbe9df}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7f8f4"/>
  <text x="600" y="46" text-anchor="middle" class="title">C4 · Nivel 1 · Contexto del Portal Académico</text>
  <text x="600" y="72" text-anchor="middle" class="small">Flujos de información con entidades externas · alcance: primaria</text>

  <!-- Entidades externas -->
  <g>
    <rect x="35" y="126" width="270" height="116" rx="14" fill="#fff" stroke="#cfdcd2" stroke-width="2"/>
    <circle cx="67" cy="162" r="15" fill="#e8f0e9"/>
    <text x="93" y="162" class="actor">Persona encargada</text>
    <text x="58" y="195" class="small">Entidad externa · actor A-01</text>
    <text x="58" y="219" class="small">Envía solicitudes y recibe información académica.</text>

    <rect x="895" y="126" width="270" height="116" rx="14" fill="#fff" stroke="#cfdcd2" stroke-width="2"/>
    <circle cx="927" cy="162" r="15" fill="#e8f0e9"/>
    <text x="953" y="162" class="actor">Docente</text>
    <text x="918" y="195" class="small">Entidad externa · actor A-02</text>
    <text x="918" y="219" class="small">Publica información y participa en la atención.</text>

    <rect x="35" y="532" width="270" height="116" rx="14" fill="#fff" stroke="#cfdcd2" stroke-width="2"/>
    <circle cx="67" cy="568" r="15" fill="#e8f0e9"/>
    <text x="93" y="568" class="actor">Comité de Evaluación</text>
    <text x="58" y="601" class="small">Entidad externa · actor A-03</text>
    <text x="58" y="625" class="small">Recibe expedientes y registra resoluciones.</text>

    <rect x="895" y="532" width="270" height="116" rx="14" fill="#fff" stroke="#cfdcd2" stroke-width="2"/>
    <circle cx="927" cy="568" r="15" fill="#e8f0e9"/>
    <text x="953" y="568" class="actor">Dirección</text>
    <text x="918" y="601" class="small">Entidad externa · actor A-04</text>
    <text x="918" y="625" class="small">Administra vínculos y supervisa pendientes.</text>
  </g>

  <!-- Caja negra del sistema -->
  <rect x="424" y="285" width="352" height="190" rx="22" fill="#205c4f"/>
  <rect x="445" y="307" width="310" height="146" rx="15" fill="none" stroke="#72a38c" stroke-width="1.5"/>
  <text x="600" y="361" text-anchor="middle" class="portal">Portal Académico</text>
  <text x="600" y="390" text-anchor="middle" class="subtitle">Sistema web institucional</text>
  <text x="600" y="418" text-anchor="middle" class="subtitle">Centro Educativo María Montessori</text>

  <!-- Conectores bidireccionales agrupados; IDs y nombres quedan detallados en la tabla de flujos. -->
  <path d="M305 173 C350 173 370 245 432 315" fill="none" stroke="#59796b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M432 430 C374 474 350 218 305 218" fill="none" stroke="#59796b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="300" y="245" width="127" height="39" rx="8" fill="#fff" stroke="#d7e0d9"/>
  <text x="363" y="261" text-anchor="middle" class="id">F-01 a F-05</text><text x="363" y="276" text-anchor="middle" class="small">solicitudes</text>
  <rect x="300" y="387" width="127" height="42" rx="8" fill="#fff" stroke="#d7e0d9"/>
  <text x="363" y="404" text-anchor="middle" class="id">F-06 a F-12</text><text x="363" y="420" text-anchor="middle" class="small">publicaciones y avisos</text>

  <path d="M895 173 C850 173 830 245 768 315" fill="none" stroke="#59796b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M768 430 C826 474 850 218 895 218" fill="none" stroke="#59796b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="773" y="245" width="127" height="39" rx="8" fill="#fff" stroke="#d7e0d9"/>
  <text x="836" y="261" text-anchor="middle" class="id">F-13 a F-17</text><text x="836" y="276" text-anchor="middle" class="small">datos docentes</text>
  <rect x="773" y="387" width="127" height="42" rx="8" fill="#fff" stroke="#d7e0d9"/>
  <text x="836" y="404" text-anchor="middle" class="id">F-18 a F-21</text><text x="836" y="420" text-anchor="middle" class="small">respuestas y solicitudes</text>

  <path d="M305 577 C354 577 372 516 432 455" fill="none" stroke="#59796b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M432 448 C372 495 354 620 305 620" fill="none" stroke="#59796b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="300" y="490" width="127" height="38" rx="8" fill="#fff" stroke="#d7e0d9"/>
  <text x="363" y="506" text-anchor="middle" class="id">F-22 a F-23</text><text x="363" y="521" text-anchor="middle" class="small">resolución / solicitud</text>
  <rect x="300" y="650" width="127" height="38" rx="8" fill="#fff" stroke="#d7e0d9"/>
  <text x="363" y="666" text-anchor="middle" class="id">F-24</text><text x="363" y="681" text-anchor="middle" class="small">expediente</text>

  <path d="M895 577 C846 577 828 516 768 455" fill="none" stroke="#59796b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M768 448 C828 495 846 620 895 620" fill="none" stroke="#59796b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="773" y="490" width="127" height="38" rx="8" fill="#fff" stroke="#d7e0d9"/>
  <text x="836" y="506" text-anchor="middle" class="id">F-25 a F-29</text><text x="836" y="521" text-anchor="middle" class="small">vínculos y supervisión</text>
  <rect x="773" y="650" width="127" height="38" rx="8" fill="#fff" stroke="#d7e0d9"/>
  <text x="836" y="666" text-anchor="middle" class="id">F-30 a F-34</text><text x="836" y="681" text-anchor="middle" class="small">alertas y estados</text>

  <text x="600" y="728" text-anchor="middle" class="small">F-xx identifica cada flujo individual definido en la tabla del documento.</text>
</svg>
