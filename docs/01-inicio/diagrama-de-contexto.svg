<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">C4 nivel 1: contexto del sistema Portal Académico</title>
  <desc id="description">Diagrama C4 de nivel 1. El Portal Académico aparece como un solo sistema de software (caja negra) y se relaciona con cuatro personas: persona encargada legal, docente, Comité de Evaluación y Dirección. Cada relación indica qué hace la persona o qué entrega el Portal y los flujos F-xx que la detallan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#707070"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .name{font-size:17px;font-weight:700;fill:#fff}
      .type{font-size:12px;fill:#dfe9f5}
      .desc{font-size:13px;fill:#fff}
      .sys{font-size:22px;font-weight:700;fill:#fff}
      .rel{font-size:13px;fill:#444}
      .tech{font-size:12px;fill:#777}
      .line{stroke:#707070;stroke-width:1.6;stroke-dasharray:7 5;fill:none}
      .foot{font-size:18px;fill:#333}
      .note{font-size:13px;fill:#666}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>

  <!-- Personas (notación C4) -->
  <g>
    <circle cx="170" cy="362" r="34" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
    <rect x="40" y="392" width="260" height="130" rx="36" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
    <text x="170" y="428" text-anchor="middle" class="name">Persona encargada legal</text>
    <text x="170" y="448" text-anchor="middle" class="type">[Persona] A-01</text>
    <text x="170" y="474" text-anchor="middle" class="desc">Madre, padre o tutor legal que</text>
    <text x="170" y="492" text-anchor="middle" class="desc">sigue el progreso del estudiante.</text>
  </g>
  <g>
    <circle cx="1230" cy="362" r="34" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
    <rect x="1100" y="392" width="260" height="130" rx="36" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
    <text x="1230" y="428" text-anchor="middle" class="name">Docente</text>
    <text x="1230" y="448" text-anchor="middle" class="type">[Persona] A-02</text>
    <text x="1230" y="474" text-anchor="middle" class="desc">Registra y publica evaluaciones</text>
    <text x="1230" y="492" text-anchor="middle" class="desc">y calificaciones de su grupo.</text>
  </g>
  <g>
    <circle cx="700" cy="62" r="34" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
    <rect x="570" y="92" width="260" height="130" rx="36" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
    <text x="700" y="128" text-anchor="middle" class="name">Comité de Evaluación</text>
    <text x="700" y="148" text-anchor="middle" class="type">[Persona] A-03</text>
    <text x="700" y="174" text-anchor="middle" class="desc">Órgano que analiza y resuelve</text>
    <text x="700" y="192" text-anchor="middle" class="desc">las apelaciones de calificación.</text>
  </g>
  <g>
    <circle cx="700" cy="662" r="34" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
    <rect x="570" y="692" width="260" height="130" rx="36" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
    <text x="700" y="728" text-anchor="middle" class="name">Dirección</text>
    <text x="700" y="748" text-anchor="middle" class="type">[Persona] A-04</text>
    <text x="700" y="774" text-anchor="middle" class="desc">Administra vínculos, plazos y</text>
    <text x="700" y="792" text-anchor="middle" class="desc">catálogos; supervisa avisos.</text>
  </g>

  <!-- Sistema en alcance: caja negra -->
  <rect x="540" y="360" width="320" height="150" rx="8" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
  <text x="700" y="410" text-anchor="middle" class="sys">Portal Académico</text>
  <text x="700" y="432" text-anchor="middle" class="type">[Sistema de software]</text>
  <text x="700" y="460" text-anchor="middle" class="desc">Publica el progreso académico y da</text>
  <text x="700" y="478" text-anchor="middle" class="desc">seguimiento a avisos y apelaciones.</text>

  <!-- Persona encargada -->
  <line x1="300" y1="420" x2="538" y2="420" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="347" text-anchor="middle" class="rel">Consulta el progreso y envía</text>
  <text x="420" y="364" text-anchor="middle" class="rel">mensajes, apelaciones,</text>
  <text x="420" y="381" text-anchor="middle" class="rel">quejas y acuses</text>
  <text x="420" y="404" text-anchor="middle" class="tech">[F-01 a F-05]</text>
  <line x1="540" y1="480" x2="302" y2="480" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="502" text-anchor="middle" class="rel">Muestra publicaciones y envía</text>
  <text x="420" y="519" text-anchor="middle" class="rel">avisos, respuestas y</text>
  <text x="420" y="536" text-anchor="middle" class="rel">resoluciones</text>
  <text x="420" y="555" text-anchor="middle" class="tech">[F-06 a F-12]</text>

  <!-- Docente -->
  <line x1="1100" y1="420" x2="862" y2="420" class="line" marker-end="url(#arrow)"/>
  <text x="980" y="347" text-anchor="middle" class="rel">Publica evaluaciones y notas,</text>
  <text x="980" y="364" text-anchor="middle" class="rel">corrige, responde y aporta</text>
  <text x="980" y="381" text-anchor="middle" class="rel">a apelaciones</text>
  <text x="980" y="404" text-anchor="middle" class="tech">[F-13 a F-17]</text>
  <line x1="860" y1="480" x2="1098" y2="480" class="line" marker-end="url(#arrow)"/>
  <text x="980" y="502" text-anchor="middle" class="rel">Entrega mensajes, avisos de</text>
  <text x="980" y="519" text-anchor="middle" class="rel">apelación, solicitudes y</text>
  <text x="980" y="536" text-anchor="middle" class="rel">resúmenes de publicación</text>
  <text x="980" y="555" text-anchor="middle" class="tech">[F-18 a F-21]</text>

  <!-- Comité de Evaluación -->
  <line x1="650" y1="222" x2="650" y2="358" class="line" marker-end="url(#arrow)"/>
  <text x="638" y="268" text-anchor="end" class="rel">Registra resoluciones</text>
  <text x="638" y="285" text-anchor="end" class="rel">y pide información</text>
  <text x="638" y="304" text-anchor="end" class="tech">[F-22, F-23]</text>
  <line x1="750" y1="360" x2="750" y2="224" class="line" marker-end="url(#arrow)"/>
  <text x="762" y="268" class="rel">Entrega el expediente</text>
  <text x="762" y="285" class="rel">de la apelación</text>
  <text x="762" y="304" class="tech">[F-24]</text>

  <!-- Dirección -->
  <line x1="650" y1="692" x2="650" y2="512" class="line" marker-end="url(#arrow)"/>
  <text x="638" y="584" text-anchor="end" class="rel">Administra vínculos, plazos,</text>
  <text x="638" y="601" text-anchor="end" class="rel">quejas y supervisión; registra</text>
  <text x="638" y="618" text-anchor="end" class="rel">grupos, matrícula y docentes</text>
  <text x="638" y="637" text-anchor="end" class="tech">[F-25 a F-29, F-35 a F-39]</text>
  <line x1="750" y1="510" x2="750" y2="690" class="line" marker-end="url(#arrow)"/>
  <text x="762" y="584" class="rel">Envía alertas, estado del</text>
  <text x="762" y="601" class="rel">seguimiento y registro</text>
  <text x="762" y="618" class="rel">de consultas</text>
  <text x="762" y="637" class="tech">[F-30 a F-34]</text>

  <!-- Título al pie, como en la notación C4 -->
  <text x="40" y="862" class="foot">[Diagrama de contexto del sistema] Portal Académico — C4 nivel 1</text>
  <text x="40" y="884" class="note">Centro Educativo María Montessori. Los F-xx remiten a la tabla de flujos de diagrama-de-contexto.md; F-35 a F-39 corresponden a propuestas CU-17 a CU-21.</text>
</svg>
